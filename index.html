<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado Libre OAuth Callback</title>
</head>
<body>
  <h2>Autorización Mercado Libre</h2>
  <p id="status">Procesando autorización...</p>

  <div id="result" style="display:none;">
    <p><strong>Authorization Code:</strong></p>
    <textarea id="code" rows="4" cols="70" readonly></textarea>

    <p><strong>State:</strong></p>
    <textarea id="state" rows="2" cols="70" readonly></textarea>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    const status = document.getElementById("status");
    const result = document.getElementById("result");

    if (error) {
      status.textContent = "La autorización devolvió un error: " + error;
    } else if (code) {
      status.textContent = "Autorización recibida correctamente.";
      document.getElementById("code").value = code;
      document.getElementById("state").value = state || "";
      result.style.display = "block";
    } else {
      status.textContent = "Esperando una respuesta de Mercado Libre.";
    }
  </script>
</body>
</html>
